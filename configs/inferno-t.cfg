// inferno T spawns — 5 spawns
// mouse4 = previous spawn, mouse5 = next spawn

sv_cheats 1

// Aliases
alias "prevPos" "Position5"
alias "nextPos" "Position1"

alias "Position1" "setpos -1586.5 440.8 -64; setang 0 -58 0; alias prevPos Position5; alias nextPos Position2; say 1;"
alias "Position2" "setpos -1520.1 430.9 -64; setang 0 -73 0; alias prevPos Position1; alias nextPos Position3; say 2;"
alias "Position3" "setpos -1675.6 351.7 -64; setang 0 -34 0; alias prevPos Position2; alias nextPos Position4; say 3;"
alias "Position4" "setpos -1657.2 419.6 -64; setang 0 -44 0; alias prevPos Position3; alias nextPos Position5; say 4;"
alias "Position5" "setpos -1662.2 288.8 -64; setang 0 -21 0; alias prevPos Position4; alias nextPos Position1; say 5;"

// Binds
bind "mouse4" "prevPos"
bind "mouse5" "nextPos"
