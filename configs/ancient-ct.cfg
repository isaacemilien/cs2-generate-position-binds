// ancient CT spawns — 5 spawns
// mouse4 = previous spawn, mouse5 = next spawn

sv_cheats 1

// Aliases
alias "prevPos" "Position5"
alias "nextPos" "Position1"

alias "Position1" "setpos -512 1696 26.8; setang 0 -102 0; alias prevPos Position5; alias nextPos Position2; say 1;"
alias "Position2" "setpos -448 1728 30.7; setang 0 -78 0; alias prevPos Position1; alias nextPos Position3; say 2;"
alias "Position3" "setpos -352 1728 28.8; setang 0 -84 0; alias prevPos Position2; alias nextPos Position4; say 3;"
alias "Position4" "setpos -256 1728 25.6; setang 0 -89 0; alias prevPos Position3; alias nextPos Position5; say 4;"
alias "Position5" "setpos -192 1696 26.1; setang 0 -93 0; alias prevPos Position4; alias nextPos Position1; say 5;"

// Binds
bind "mouse4" "prevPos"
bind "mouse5" "nextPos"
