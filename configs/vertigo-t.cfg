// vertigo T spawns — 5 spawns
// mouse4 = previous spawn, mouse5 = next spawn

sv_cheats 1

// Aliases
alias "prevPos" "Position5"
alias "nextPos" "Position1"

alias "Position1" "setpos -1468.8 -1194.4 11488; setang 0 150 0; alias prevPos Position5; alias nextPos Position2; say 1;"
alias "Position2" "setpos -1411.3 -1130.3 11488; setang 0 167 0; alias prevPos Position1; alias nextPos Position3; say 2;"
alias "Position3" "setpos -1439.8 -1322 11488; setang 0 137 0; alias prevPos Position2; alias nextPos Position4; say 3;"
alias "Position4" "setpos -1439.6 -1251.7 11488; setang 0 157 0; alias prevPos Position3; alias nextPos Position5; say 4;"
alias "Position5" "setpos -1502.6 -1360.8 11488; setang 0 139 0; alias prevPos Position4; alias nextPos Position1; say 5;"

// Binds
bind "mouse4" "prevPos"
bind "mouse5" "nextPos"
