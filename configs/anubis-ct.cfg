// anubis CT spawns — 5 spawns
// mouse4 = previous spawn, mouse5 = next spawn

sv_cheats 1

// Aliases
alias "prevPos" "Position5"
alias "nextPos" "Position1"

alias "Position1" "setpos -476 2216 25; setang 0 -55 0; alias prevPos Position5; alias nextPos Position2; say 1;"
alias "Position2" "setpos -608 2120 16.1; setang 0 -33 0; alias prevPos Position1; alias nextPos Position3; say 2;"
alias "Position3" "setpos -560 2192 25; setang 0 -59 0; alias prevPos Position2; alias nextPos Position4; say 3;"
alias "Position4" "setpos -400 2192 25; setang 0 -60 0; alias prevPos Position3; alias nextPos Position5; say 4;"
alias "Position5" "setpos -360 2120 16.1; setang 0 -61 0; alias prevPos Position4; alias nextPos Position1; say 5;"

// Binds
bind "mouse4" "prevPos"
bind "mouse5" "nextPos"
