// mirage T spawns — 10 spawns
// mouse4 = previous spawn, mouse5 = next spawn

sv_cheats 1

// Aliases
alias "prevPos" "Position10"
alias "nextPos" "Position1"

alias "Position1" "setpos 1136 32 -164.8; setang 0 94 0; alias prevPos Position10; alias nextPos Position2; say 1;"
alias "Position2" "setpos 1296 32 -168; setang 0 -161 0; alias prevPos Position1; alias nextPos Position3; say 2;"
alias "Position3" "setpos 1136 -64 -164.5; setang 0 89 0; alias prevPos Position2; alias nextPos Position4; say 3;"
alias "Position4" "setpos 1216 -115 -164; setang 0 80 0; alias prevPos Position3; alias nextPos Position5; say 4;"
alias "Position5" "setpos 1216 -16 -164; setang 0 -91 0; alias prevPos Position4; alias nextPos Position6; say 5;"
alias "Position6" "setpos 1136 -256 -164.8; setang 0 90 0; alias prevPos Position5; alias nextPos Position7; say 6;"
alias "Position7" "setpos 1136 -160 -164.4; setang 0 77 0; alias prevPos Position6; alias nextPos Position8; say 7;"
alias "Position8" "setpos 1216 -211 -164; setang 0 -84 0; alias prevPos Position7; alias nextPos Position9; say 8;"
alias "Position9" "setpos 1216 -307 -164.8; setang 0 90 0; alias prevPos Position8; alias nextPos Position10; say 9;"
alias "Position10" "setpos 1296 -352 -168; setang 0 -93 0; alias prevPos Position9; alias nextPos Position1; say 10;"

// Binds
bind "mouse4" "prevPos"
bind "mouse5" "nextPos"
