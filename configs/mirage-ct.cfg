// mirage CT spawns — 5 spawns
// mouse4 = previous spawn, mouse5 = next spawn

sv_cheats 1

// Aliases
alias "prevPos" "Position5"
alias "nextPos" "Position1"

alias "Position1" "setpos -1776 -1800 -264; setang 0 35 0; alias prevPos Position5; alias nextPos Position2; say 1;"
alias "Position2" "setpos -1656 -1800 -267.2; setang 0 82 0; alias prevPos Position1; alias nextPos Position3; say 2;"
alias "Position3" "setpos -1720 -1896 -267.6; setang 0 73 0; alias prevPos Position2; alias nextPos Position4; say 3;"
alias "Position4" "setpos -1776 -1976 -264; setang 0 70 0; alias prevPos Position3; alias nextPos Position5; say 4;"
alias "Position5" "setpos -1656 -1976 -267.5; setang 0 -44 0; alias prevPos Position4; alias nextPos Position1; say 5;"

// Binds
bind "mouse4" "prevPos"
bind "mouse5" "nextPos"
