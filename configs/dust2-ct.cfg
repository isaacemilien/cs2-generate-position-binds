// dust2 CT spawns — 5 spawns
// mouse4 = previous spawn, mouse5 = next spawn

sv_cheats 1

// Aliases
alias "prevPos" "Position5"
alias "nextPos" "Position1"

alias "Position1" "setpos 182.2 2439 -121; setang 0 -102 0; alias prevPos Position5; alias nextPos Position2; say 1;"
alias "Position2" "setpos 258.2 2480.6 -121.1; setang 0 -49 0; alias prevPos Position1; alias nextPos Position3; say 2;"
alias "Position3" "setpos 334.4 2433.7 -120.4; setang 0 -55 0; alias prevPos Position2; alias nextPos Position4; say 3;"
alias "Position4" "setpos 160.1 2369.7 -119.9; setang 0 -105 0; alias prevPos Position3; alias nextPos Position5; say 4;"
alias "Position5" "setpos 351.4 2352.9 -120.5; setang 0 -33 0; alias prevPos Position4; alias nextPos Position1; say 5;"

// Binds
bind "mouse4" "prevPos"
bind "mouse5" "nextPos"
