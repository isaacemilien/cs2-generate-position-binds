// cache CT spawns — 8 spawns
// mouse4 = previous spawn, mouse5 = next spawn

sv_cheats 1

// Aliases
alias "prevPos" "Position8"
alias "nextPos" "Position1"

alias "Position1" "setpos -1448.3 954.8 1614; setang 0 -89 0; alias prevPos Position8; alias nextPos Position2; say 1;"
alias "Position2" "setpos -1560.3 874.8 1614; setang 0 -74 0; alias prevPos Position1; alias nextPos Position3; say 2;"
alias "Position3" "setpos -1488.3 874.8 1614; setang 0 -83 0; alias prevPos Position2; alias nextPos Position4; say 3;"
alias "Position4" "setpos -1400.3 874.8 1614; setang 0 -91 0; alias prevPos Position3; alias nextPos Position5; say 4;"
alias "Position5" "setpos -1600.3 794.8 1614; setang 0 -69 0; alias prevPos Position4; alias nextPos Position6; say 5;"
alias "Position6" "setpos -1488.3 706.8 1614; setang 0 -79 0; alias prevPos Position5; alias nextPos Position7; say 6;"
alias "Position7" "setpos -1448.3 794.8 1614; setang 0 -86 0; alias prevPos Position6; alias nextPos Position8; say 7;"
alias "Position8" "setpos -1400.3 706.8 1614; setang 0 -91 0; alias prevPos Position7; alias nextPos Position1; say 8;"

// Binds
bind "mouse4" "prevPos"
bind "mouse5" "nextPos"
