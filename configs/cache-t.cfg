// cache T spawns — 5 spawns
// mouse4 = previous spawn, mouse5 = next spawn

sv_cheats 1

// Aliases
alias "prevPos" "Position5"
alias "nextPos" "Position1"

alias "Position1" "setpos 3019.3 225.4 1616; setang 0 -148 0; alias prevPos Position5; alias nextPos Position2; say 1;"
alias "Position2" "setpos 3077.8 135.9 1616; setang 0 -164 0; alias prevPos Position1; alias nextPos Position3; say 2;"
alias "Position3" "setpos 2916.8 69.4 1608; setang 0 -162 0; alias prevPos Position2; alias nextPos Position4; say 3;"
alias "Position4" "setpos 3041.8 -21.1 1608; setang 0 120 0; alias prevPos Position3; alias nextPos Position5; say 4;"
alias "Position5" "setpos 3094.3 -152.6 1608; setang 0 125 0; alias prevPos Position4; alias nextPos Position1; say 5;"

// Binds
bind "mouse4" "prevPos"
bind "mouse5" "nextPos"
