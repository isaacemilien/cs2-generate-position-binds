alias "Position3" "setpos -1141 -808 116.7; setang 0 114 0; alias prevPos Position2; alias nextPos Position4; say 3;"
alias "Position4" "setpos -1076 -843 116.8; setang 0 120 0; alias prevPos Position3; alias nextPos Position5; say 4;"
alias "Position5" "setpos -1015 -808 116.1; setang 0 122 0; alias prevPos Position4; alias nextPos Position6; say 5;"
alias "Position6" "setpos -980 -754 120.2; setang 0 126 0; alias prevPos Position5; alias nextPos Position7; say 6;"
alias "Position7" "setpos -822.4 -795.6 117.3; setang 0 13 0; alias prevPos Position6; alias nextPos Position8; say 7;"
alias "Position8" "setpos -760.7 -836.2 117.1; setang 0 25 0; alias prevPos Position7; alias nextPos Position9; say 8;"
alias "Position9" "setpos -696.8 -806.6 116.7; setang 0 25 0; alias prevPos Position8; alias nextPos Position10; say 9;"
