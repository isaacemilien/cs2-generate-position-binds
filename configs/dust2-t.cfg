// dust2 T spawns — 15 spawns
// mouse4 = previous spawn, mouse5 = next spawn

sv_cheats 1

// Aliases
alias "prevPos" "Position15"
alias "nextPos" "Position1"

alias "Position1" "setpos -857.5 -738.4 122.1; setang 0 6 0; alias prevPos Position15; alias nextPos Position2; say 1;"
