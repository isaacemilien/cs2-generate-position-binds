// nuke T spawns — 6 spawns
// mouse4 = previous spawn, mouse5 = next spawn

sv_cheats 1

// Aliases
alias "prevPos" "Position6"
alias "nextPos" "Position1"

alias "Position1" "setpos -1947 -965.1 -416; setang 0 -30 0; alias prevPos Position6; alias nextPos Position2; say 1;"
alias "Position2" "setpos -1808 -1025 -416; setang 0 -27 0; alias prevPos Position1; alias nextPos Position3; say 2;"
alias "Position3" "setpos -1947 -1102.1 -416; setang 0 -5 0; alias prevPos Position2; alias nextPos Position4; say 3;"
alias "Position4" "setpos -1874 -1076 -416; setang 0 -7 0; alias prevPos Position3; alias nextPos Position5; say 4;"
alias "Position5" "setpos -1832 -1160 -416; setang 0 3 0; alias prevPos Position4; alias nextPos Position6; say 5;"
alias "Position6" "setpos -1808 -1089 -416; setang 0 -4 0; alias prevPos Position5; alias nextPos Position1; say 6;"

// Binds
bind "mouse4" "prevPos"
bind "mouse5" "nextPos"
