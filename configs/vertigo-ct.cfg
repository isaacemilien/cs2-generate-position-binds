// vertigo CT spawns — 5 spawns
// mouse4 = previous spawn, mouse5 = next spawn

sv_cheats 1

// Aliases
alias "prevPos" "Position5"
alias "nextPos" "Position1"

alias "Position1" "setpos -1189.3 862.2 11776; setang 0 -77 0; alias prevPos Position5; alias nextPos Position2; say 1;"
alias "Position2" "setpos -1126.6 925.9 11776; setang 0 -95 0; alias prevPos Position1; alias nextPos Position3; say 2;"
alias "Position3" "setpos -1044 924.3 11776; setang 0 -99 0; alias prevPos Position2; alias nextPos Position4; say 3;"
alias "Position4" "setpos -929.6 918.6 11776; setang 0 -110 0; alias prevPos Position3; alias nextPos Position5; say 4;"
alias "Position5" "setpos -860.1 940.3 11776; setang 0 -111 0; alias prevPos Position4; alias nextPos Position1; say 5;"

// Binds
bind "mouse4" "prevPos"
bind "mouse5" "nextPos"
