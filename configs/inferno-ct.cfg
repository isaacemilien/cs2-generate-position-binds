// inferno CT spawns — 6 spawns
// mouse4 = previous spawn, mouse5 = next spawn

sv_cheats 1

// Aliases
alias "prevPos" "Position6"
alias "nextPos" "Position1"

alias "Position1" "setpos 2397 2079 132.8; setang 0 -92 0; alias prevPos Position6; alias nextPos Position2; say 1;"
alias "Position2" "setpos 2456.8 2153.2 132.1; setang 0 -86 0; alias prevPos Position1; alias nextPos Position3; say 2;"
alias "Position3" "setpos 2493 2090 132.6; setang 0 -111 0; alias prevPos Position2; alias nextPos Position4; say 3;"
alias "Position4" "setpos 2292.1 2027.7 136; setang 0 -87 0; alias prevPos Position3; alias nextPos Position5; say 4;"
alias "Position5" "setpos 2353 1977 135.5; setang 0 -90 0; alias prevPos Position4; alias nextPos Position6; say 5;"
alias "Position6" "setpos 2472.3 2006 134.5; setang 0 -106 0; alias prevPos Position5; alias nextPos Position1; say 6;"

// Binds
bind "mouse4" "prevPos"
bind "mouse5" "nextPos"
