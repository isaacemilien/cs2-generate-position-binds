// anubis T spawns — 11 spawns
// mouse4 = previous spawn, mouse5 = next spawn

sv_cheats 1

// Aliases
alias "prevPos" "Position11"
alias "nextPos" "Position1"

alias "Position1" "setpos -384 -1552 -12; setang 0 146 0; alias prevPos Position11; alias nextPos Position2; say 1;"
alias "Position2" "setpos -328 -1528 -12; setang 0 145 0; alias prevPos Position1; alias nextPos Position3; say 2;"
alias "Position3" "setpos -234 -1503.1 -12; setang 0 25 0; alias prevPos Position2; alias nextPos Position4; say 3;"
alias "Position4" "setpos -154 -1503.1 -12; setang 0 19 0; alias prevPos Position3; alias nextPos Position5; say 4;"
alias "Position5" "setpos -416 -1608 2; setang 0 118 0; alias prevPos Position4; alias nextPos Position6; say 5;"
alias "Position6" "setpos -304 -1608 -12; setang 0 145 0; alias prevPos Position5; alias nextPos Position7; say 6;"
alias "Position7" "setpos -264 -1560 -12; setang 0 25 0; alias prevPos Position6; alias nextPos Position8; say 7;"
alias "Position8" "setpos -192 -1608 -12; setang 0 32 0; alias prevPos Position7; alias nextPos Position9; say 8;"
alias "Position9" "setpos -144 -1568 -12; setang 0 29 0; alias prevPos Position8; alias nextPos Position10; say 9;"
alias "Position10" "setpos -128 -1632 -1; setang 0 35 0; alias prevPos Position9; alias nextPos Position11; say 10;"
alias "Position11" "setpos -416 -1696 2; setang 0 82 0; alias prevPos Position10; alias nextPos Position1; say 11;"

// Binds
bind "mouse4" "prevPos"
bind "mouse5" "nextPos"
