// overpass CT spawns — 5 spawns
// mouse4 = previous spawn, mouse5 = next spawn

sv_cheats 1

// Aliases
alias "prevPos" "Position5"
alias "nextPos" "Position1"

alias "Position1" "setpos -2343 797 476; setang 0 12 0; alias prevPos Position5; alias nextPos Position2; say 1;"
alias "Position2" "setpos -2275 842 476; setang 0 2 0; alias prevPos Position1; alias nextPos Position3; say 2;"
alias "Position3" "setpos -2190 817 476; setang 0 18 0; alias prevPos Position2; alias nextPos Position4; say 3;"
alias "Position4" "setpos -2273 770 476; setang 0 -105 0; alias prevPos Position3; alias nextPos Position5; say 4;"
alias "Position5" "setpos -2199 740 476; setang 0 39 0; alias prevPos Position4; alias nextPos Position1; say 5;"

// Binds
bind "mouse4" "prevPos"
bind "mouse5" "nextPos"
