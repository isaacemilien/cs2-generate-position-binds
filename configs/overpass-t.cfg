// overpass T spawns — 11 spawns
// mouse4 = previous spawn, mouse5 = next spawn

sv_cheats 1

// Aliases
alias "prevPos" "Position11"
alias "nextPos" "Position1"

alias "Position1" "setpos -1510.4 -3053.9 281.1; setang 0 38 0; alias prevPos Position11; alias nextPos Position2; say 1;"
alias "Position2" "setpos -1499 -3126 276.9; setang 0 43 0; alias prevPos Position1; alias nextPos Position3; say 2;"
alias "Position3" "setpos -1463 -3190 280.1; setang 0 45 0; alias prevPos Position2; alias nextPos Position4; say 3;"
alias "Position4" "setpos -1448 -3076 265.2; setang 0 39 0; alias prevPos Position3; alias nextPos Position5; say 4;"
alias "Position5" "setpos -1422.4 -3129.7 268.4; setang 0 45 0; alias prevPos Position4; alias nextPos Position6; say 5;"
alias "Position6" "setpos -1395 -3190 272.2; setang 0 54 0; alias prevPos Position5; alias nextPos Position7; say 6;"
alias "Position7" "setpos -1363 -3122 260.6; setang 0 48 0; alias prevPos Position6; alias nextPos Position8; say 7;"
alias "Position8" "setpos -1331 -3190 264.8; setang 0 54 0; alias prevPos Position7; alias nextPos Position9; say 8;"
alias "Position9" "setpos -1391 -3262 280.1; setang 0 53 0; alias prevPos Position8; alias nextPos Position10; say 9;"
alias "Position10" "setpos -1327 -3262 272.7; setang 0 61 0; alias prevPos Position9; alias nextPos Position11; say 10;"
alias "Position11" "setpos -1271 -3262 266.2; setang 0 58 0; alias prevPos Position10; alias nextPos Position1; say 11;"

// Binds
bind "mouse4" "prevPos"
bind "mouse5" "nextPos"
