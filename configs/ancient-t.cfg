// ancient T spawns — 5 spawns
// mouse4 = previous spawn, mouse5 = next spawn

sv_cheats 1

// Aliases
alias "prevPos" "Position5"
alias "nextPos" "Position1"

alias "Position1" "setpos -520 -2224 -163.3; setang 0 121 0; alias prevPos Position5; alias nextPos Position2; say 1;"
alias "Position2" "setpos -392 -2224 -163.3; setang 0 70 0; alias prevPos Position1; alias nextPos Position3; say 2;"
alias "Position3" "setpos -584 -2288 -162.4; setang 0 90 0; alias prevPos Position2; alias nextPos Position4; say 3;"
alias "Position4" "setpos -456 -2288 -163.3; setang 0 76 0; alias prevPos Position3; alias nextPos Position5; say 4;"
alias "Position5" "setpos -328 -2288 -163.3; setang 0 81 0; alias prevPos Position4; alias nextPos Position1; say 5;"

// Binds
bind "mouse4" "prevPos"
bind "mouse5" "nextPos"
